server {
  listen 80;
  server_name www.baasforge.com;
  return 301 https://baasforge.com$request_uri;
}

server {
  listen 80;
  server_name baasforge.com;
  return 301 https://baasforge.com$request_uri;
}

server {
  listen 443 ssl;
  http2 on;
  server_name www.baasforge.com;

  ssl_certificate /etc/letsencrypt/live/baasforge.com/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/baasforge.com/privkey.pem;

  return 301 https://baasforge.com$request_uri;
}

server {
  listen 443 ssl;
  http2 on;
  server_name baasforge.com;

  ssl_certificate /etc/letsencrypt/live/baasforge.com/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/baasforge.com/privkey.pem;
  ssl_session_timeout 1d;
  ssl_session_cache shared:SSL:50m;
  ssl_protocols TLSv1.2 TLSv1.3;

  root /usr/share/nginx/html;
  index index.html;

  location / {
    try_files $uri $uri.html /index.html;
  }

  location ~* \.(?:ico|css|js|gif|jpe?g|png|woff2?|eot|ttf|svg)$ {
    expires 6M;
    access_log off;
    add_header Cache-Control "public";
  }

  error_page 404 /index.html;
}
