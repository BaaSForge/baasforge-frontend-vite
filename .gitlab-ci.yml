include:
  - project: infra/ci-templates
    ref: main
    file: /common-systemd-deploy.yml

stages:
    - stage_build
    - stage_deploy
    - prod_build
    - prod_deploy

stage_build_and_push:
    stage: stage_build
    cache:
        paths:
            - node_modules/
            - build/
    rules:
        - if: '$CI_COMMIT_TAG =~ /^v[0-9]+\.[0-9]+\.[0-9]+-stage\.[0-9]+$/'
    before_script:
        - echo "$N_2025_REGISTRY_PASS" | docker login "$N_2025_REGISTRY_HOST" -u "$N_2025_REGISTRY_USER" --password-stdin
    script:
        - IMAGE_NAME=${N_2025_REGISTRY_HOST#https://}/baal-frontend
        - |
            docker build \
              --build-arg APP_ENV="STAGE" \
              --build-arg NPM_REGISTRY=$N_2025_NPM_REGISTRY \
              --build-arg NPM_PASS=$N_2025_NPM_PASS \
              --build-arg NPM_USER=$N_2025_NPM_USER \
              -t $IMAGE_NAME:$CI_COMMIT_TAG .
        - docker push $IMAGE_NAME:$CI_COMMIT_TAG

stage_deploy:
    stage: stage_deploy
    extends: .supervisord_deploy
    rules:
        - if: '$CI_COMMIT_TAG =~ /^v[0-9]+\.[0-9]+\.[0-9]+-stage\.[0-9]+$/'
    before_script:
        - mkdir -p ~/.ssh
        - echo "$REV_APPS_STAGE_ENV_SSH_KEY_B64" | base64 -d > ~/.ssh/id_ed25519
        - chmod 600 ~/.ssh/id_ed25519
        - ssh-keyscan -p 2244 -H $REV_APPS_STAGE_ENV_SSH_HOST >> ~/.ssh/known_hosts
    variables:
        SSH_HOST: "$REV_APPS_STAGE_ENV_SSH_HOST"
        SSH_PORT: "2244"
        SERVICE_NAME: "baal-frontend"
        SERVICE_IMAGE: "baal-frontend"
        DOCKER_EXEC_BIN: "/usr/local/bin/docker"
        DOCKER_PARAMS: >
            -p 1200:1200

prod_build_and_push:
    stage: prod_build
    cache:
        paths:
            - node_modules/
            - build/
    rules:
        - if: '$CI_COMMIT_TAG =~ /^v[0-9]+\.[0-9]+\.[0-9]+-prod\.[0-9]+$/'
    before_script:
        - echo "$N_2025_REGISTRY_PASS" | docker login "$N_2025_REGISTRY_HOST" -u "$N_2025_REGISTRY_USER" --password-stdin
    script:
        - IMAGE_NAME=${N_2025_REGISTRY_HOST#https://}/baal-frontend
        - |
            docker build \
              --build-arg APP_ENV="PROD" \
              --build-arg NPM_REGISTRY=$N_2025_NPM_REGISTRY \
              --build-arg NPM_PASS=$N_2025_NPM_PASS \
              --build-arg NPM_USER=$N_2025_NPM_USER \
              -t $IMAGE_NAME:$CI_COMMIT_TAG .
        - docker push $IMAGE_NAME:$CI_COMMIT_TAG

prod_deploy:
    stage: prod_deploy
    extends: .supervisord_deploy
    rules:
        - if: '$CI_COMMIT_TAG =~ /^v[0-9]+\.[0-9]+\.[0-9]+-prod\.[0-9]+$/'
    before_script:
        - mkdir -p ~/.ssh
        - echo "$REV_APPS_PROD_ENV_SSH_KEY_B64" | base64 -d > ~/.ssh/id_ed25519
        - chmod 600 ~/.ssh/id_ed25519
        - ssh-keyscan -p 22 -H $REV_APPS_PROD_ENV_SSH_HOST >> ~/.ssh/known_hosts
    variables:
        SSH_HOST: "$REV_APPS_PROD_ENV_SSH_HOST"
        SSH_PORT: "22"
        SERVICE_NAME: "baal-frontend"
        SERVICE_IMAGE: "baal-frontend"
        DOCKER_EXEC_BIN: "/usr/bin/docker"
        DOCKER_PARAMS: >
            -p 1200:1200