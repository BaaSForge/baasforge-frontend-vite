server {
  listen 80;
  http2 on;
  server_name localhost;
  absolute_redirect off;

  root /usr/share/nginx/html;
  index index.html;

  location ^~ /docs {
    try_files $uri $uri.html $uri/ /docs/index.html;
  }

  location ~ ^/(careers|pricing|privacy-policy|terms-of-use)/$ {
    return 308 /$1;
  }

  location ~ ^/(?:login|dashboard)(?:/.*)?$ {
    try_files $uri $uri.html /app.html;
  }

  location ~ ^/projects/documentation/[^/]+/share/[^/]+/?$ {
    try_files $uri $uri.html /app.html;
  }

  location ~ ^/(?:500|terms-of-service)/?$ {
    try_files $uri $uri.html /app.html;
  }

  location = /app.html {
    internal;
  }

  location / {
    try_files $uri $uri.html $uri/ =404;
  }

  location ~* \.(?:ico|css|js|gif|jpe?g|png|woff2?|eot|ttf|svg)$ {
    expires 6M;
    access_log off;
    add_header Cache-Control "public";
  }

  error_page 404 /404.html;

  location = /404.html {
    internal;
  }
}
